<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dehnen</title>
<meta name="description" content="Dehnübungen mit Skizze, Erläuterung und Empfehlung – statisch und dynamisch, je Athlet als eigenes Programm.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leichtathletik">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E9EEF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1824" media="(prefers-color-scheme: dark)">
<script src="../shared/theme.js"></script>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/uebungen.css">
</head>
<body>
<main>
<!-- ============ Übersicht ============ -->
<div id="viewList">
  <a class="back" href="../">Übersicht</a>
  <h1 id="pgTitle">Dehnen</h1>
  <p class="sub" id="pgSub"></p>
  <section>
    <div class="who"><label class="fl" for="ath" style="margin:0">Für</label><select id="ath"></select></div>
    <p class="hint" id="athHint"></p>
    <details id="cfgBox" style="margin:10px 0 0;background:var(--bg)">
      <summary id="cfgSum" style="font-size:16px;padding:10px 12px"></summary>
      <div class="in">
        <span class="fl" style="margin-top:0" id="lGoal">Trainingsziel</span>
        <div class="seg" id="cGoal" role="group" aria-label="Trainingsziel"></div>
        <span class="fl" id="lLevel">Leistungsniveau</span>
        <div class="seg" id="cLevel" role="group" aria-label="Leistungsniveau"></div>
        <div id="phaseBox"><label class="fl" for="cPhase" id="lPhase">Trainingsphase</label>
        <select id="cPhase"></select></div>
        <p class="hint" id="cAge"></p>
      </div>
    </details>
  </section>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabMine" aria-selected="false">Mein Programm</button>
    <button type="button" role="tab" id="tabAll" aria-selected="true">Alle Übungen</button>
  </div>
  <div id="mineHead" hidden>
    <section style="padding:12px 14px">
      <div class="row" style="justify-content:space-between"><b id="mineCount"></b><button type="button" class="link" id="orderBtn">Reihenfolge ändern</button></div>
      <div class="cov" id="cov"></div>
      <p class="hint" id="covHint"></p>
    </section>
  </div>
  <div id="allHead">
    <div class="chips" id="fRegion"></div>
    <div class="filt">
      <select id="fEquip" aria-label="Ausrüstung"></select>
      <input type="text" id="fSearch" placeholder="Suchen …" aria-label="Übung suchen">
    </div>
    <p class="hint" id="fCount" style="margin:8px 2px"></p>
  </div>
  <div class="grid" id="grid"></div>
  <section id="histBox" hidden style="margin-top:12px">
    <h2>Verlauf</h2>
    <p class="note" style="margin-top:0" id="histSum"></p>
    <div class="hist" id="hist"></div>
  </section>
  <p class="foot">Version <span id="ver"></span> · <span id="offState">Offline-Modus wird vorbereitet …</span></p>
  <a class="btn primary block fab" href="#training" id="startBtn" hidden>Training starten</a>
</div>

<!-- ============ Übung ============ -->
<div id="viewEx" hidden>
  <a class="back" href="#" id="exBack">Zurück</a>
  <div class="detcols">
    <div>
      <div class="big" id="exSketch"></div>
      <div class="row" style="margin:8px 0 12px">
        <button type="button" class="btn" id="exPlay">▶ Bewegung abspielen</button>
        <button type="button" class="btn" id="exFav"></button>
      </div>
    </div>
    <div>
      <h1 id="exName" style="margin-top:0"></h1>
      <div class="row" id="exBadges" style="gap:6px;margin:6px 0 10px"></div>
      <section>
        <h2>Empfehlung</h2>
        <div class="dose" id="exDose"></div>
        <dl class="kv" id="exKv"></dl>
        <p class="hint" id="exNotes"></p>
        <details id="ovBox" style="margin:12px 0 0;background:var(--bg)">
          <summary style="font-size:16px;padding:10px 12px">Anpassen</summary>
          <div class="in">
            <div class="grid3">
              <div><label class="fl" for="oSets" style="margin-top:0">Serien</label><input type="number" id="oSets" min="1" max="12" inputmode="numeric"></div>
              <div><label class="fl" for="oReps" style="margin-top:0" id="oRepsLbl">Wdh.</label><input type="text" id="oReps" maxlength="12"></div>
              <div><label class="fl" for="oLoad" style="margin-top:0" id="lLoad">Gewicht</label><input type="text" id="oLoad" maxlength="20" placeholder="z. B. 40 kg"></div>
            </div>
            <label class="fl" for="oNote">Notiz</label>
            <input type="text" id="oNote" maxlength="120" placeholder="z. B. Band rot, Box 50 cm">
            <p class="err" id="oErr"></p>
            <div class="row" style="margin-top:10px">
              <button type="button" class="btn primary" id="oSave">Übernehmen</button>
              <button type="button" class="btn" id="oReset">Zurücksetzen auf Empfehlung</button>
            </div>
          </div>
        </details>
      </section>
      <section>
        <h2>Ausführung</h2>
        <ol class="steps" id="exSteps"></ol>
        <h2 style="margin-top:14px">Darauf achten</h2>
        <ul class="cues" id="exCues"></ul>
        <dl class="kv" id="exVar"></dl>
      </section>
      <section>
        <h2>Wofür?</h2>
        <p style="margin:0" id="exWhy"></p>
        <p class="note" id="exMuscles"></p>
      </section>
    </div>
  </div>
</div>

<!-- ============ Training ============ -->
<div id="viewRun" class="narrow" hidden>
  <a class="back" href="#" id="runBack">Programm</a>
  <h1 id="runTitle">Training</h1>
  <p class="sub" id="runSub"></p>
  <div id="runList"></div>
  <div class="row" style="margin-top:12px">
    <button type="button" class="btn primary" id="runDone" style="flex:1 1 auto">Training abschließen</button>
    <button type="button" class="btn danger" id="runCancel">Verwerfen</button>
  </div>
  <div class="timer" id="timer" hidden>
    <b id="tLeft">0:00</b><span class="tl" id="tLbl">Pause</span>
    <button type="button" id="tPlus">+15 s</button><button type="button" id="tSkip">Weiter</button>
  </div>
</div>
</main>
<script src="../shared/config.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/cloud.js"></script>
<script src="../shared/figur.js"></script>
<script src="../shared/dehnen.js"></script>
<script>window.LA_LIB=window.LA_DEHNEN;</script>
<script src="../shared/uebungen.js"></script>
</body>
</html>
